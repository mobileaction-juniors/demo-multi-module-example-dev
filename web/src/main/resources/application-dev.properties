spring.config.import=application-common-dev.properties

#messaging consumer properties
messaging.consumer.result.max-size=1
messaging.consumer.result.auto-start=true

messaging.queue.result.problem=ma-example-result-problem-queue

# database properties
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:db_example
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect


# To rollback long running db queries
spring.transaction.default-timeout=30

# Show or not log for each sql query
spring.jpa.show-sql=true

# Hibernate ddl auto (create, create-drop, update)
# spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.ddl-auto=create

ma.security.secure-key-token=user1,user2
ma.security.admin-token=admin1
spring.security.user.name=user1
spring.security.user.password=user1
spring.security.user.roles=ADMIN

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

messaging.queue.request=ma-example-request-queue
messaging.queue.result=ma-example-result-queue
messaging.queue.result.problem=ma-example-result-problem-queue
spring.rabbitmq.virtual-host=/
external.jsonplaceholder.base-url=https://jsonplaceholder.typicode.com
